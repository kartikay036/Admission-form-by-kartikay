<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>School Admission Form</title>
    <style>
        body {
  font-family: 'Segoe UI', sans-serif;
  background-color: #f0f4f8;
  margin: 0;
  padding: 20px;
}

.form-container {
  max-width: 600px;
  margin: auto;
  background-color: #ffffff;
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}

h2 {
  text-align: center;
  color: #333;
  margin-bottom: 25px;
}

form label {
  display: block;
  margin-top: 15px;
  margin-bottom: 5px;
  font-weight: bold;
  color: #555;
}

form input[type="text"],
form input[type="date"],
form input[type="tel"],
form input[type="email"],
form select,
form textarea {
  width: 100%;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

form textarea {
  resize: vertical;
}

button[type="submit"] {
  margin-top: 20px;
  width: 100%;
  background-color: #007bff;
  color: #fff;
  padding: 12px;
  font-size: 16px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

button[type="submit"]:hover {
  background-color: #0056b3;
}
    </style>
</head>
<body>
  <div class="form-container">
    <h2>School Admission Form</h2>
    <form>
      <label for="student-name">Student's Full Name</label>
      <input type="text" id="student-name" name="student-name" placeholder="Enter full name" required>

      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" name="dob" required>

      <label for="gender">Gender</label>
      <select id="gender" name="gender" required>
        <option value="">--Select--</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>

      <label for="class">Class Applying For</label>
      <select id="class" name="class" required>
        <option value="">--Select Class--</option>
        <option value="nursery">Nursery</option>
        <option value="kg">KG</option>
        <option value="1">Class 1</option>
        <option value="2">Class 2</option>
        <option value="3">Class 3</option>
        <option value="4">Class 4</option>
        <option value="5">Class 5</option>
      </select>

      <label for="father-name">Father's Name</label>
      <input type="text" id="father-name" name="father-name" placeholder="Enter father's name" required>

      <label for="mother-name">Mother's Name</label>
      <input type="text" id="mother-name" name="mother-name" placeholder="Enter mother's name" required>

      <label for="phone">Parent's Contact Number</label>
      <input type="tel" id="phone" name="phone" placeholder="91xxxxxxxxxx" required>

      <label for="email">Parent's Email</label>
      <input type="email" id="email" name="email" placeholder="example@gmail.com">

      <label for="address">Residential Address</label>
      <textarea id="address" name="address" rows="3" placeholder="Enter full address" required></textarea>

      <button type="submit">Submit Application</button>
    </form>
  </div>
</body>
</html>
